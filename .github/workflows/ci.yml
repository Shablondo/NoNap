name: Build NoNap

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run Swift tests
        run: swift test

      - name: Validate app icon
        run: Scripts/test-app-icon.sh

      - name: Build and smoke-test DMG
        run: Scripts/test-build-dmg.sh

      - name: Verify DMG checksum
        run: hdiutil verify .build/NoNap.dmg

      - name: Upload NoNap DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoNap-${{ github.sha }}
          path: .build/NoNap.dmg
          if-no-files-found: error

      - name: Publish DMG to the latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            --title "NoNap — latest build" \
            --target "$GITHUB_SHA" \
            --notes "Automated build of commit ${GITHUB_SHA::7}. The app is ad-hoc signed but not notarized.
          Установка: откройте NoNap.dmg и перетащите NoNap.app в Applications.
          Если macOS пишет «Приложение повреждено», выполните в Терминале:
          xattr -d com.apple.quarantine /Applications/NoNap.app — и откройте снова.
          Install: open NoNap.dmg and drag NoNap.app to Applications. If macOS says the app is damaged (it is not notarized), run in Terminal:
          xattr -d com.apple.quarantine /Applications/NoNap.app — then open again." \
            .build/NoNap.dmg
